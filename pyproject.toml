[project]
name = "tech_star"
version = "0.1.0"
description = "tech_star using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,tools]==1.4.1",
]

[project.scripts]
tech_star = "tech_star.main:run"
run_crew = "tech_star.main:run"
train = "tech_star.main:train"
replay = "tech_star.main:replay"
test = "tech_star.main:test"
run_with_trigger = "tech_star.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
